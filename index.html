<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #ff4757;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #2f2f2f;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .match-header {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #383838;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .winner {
            border-left: 4px solid #2ed573;
            background: #3d4a3d;
        }
        .top-scorer-box {
            max-width: 400px;
            margin: 40px auto;
            background: #2f2f2f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>LIVE TOURNAMENT DISPLAY</h1>
    
    <!-- Bagian Kotak Pertandingan -->
    <div class="container" id="bracket-container">
        <p style="text-align: center; width: 100%;">Memuat data pertandingan...</p>
    </div>

    <!-- Bagian Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                // 1. Render Data Pertandingan
                let bracketHTML = "";
                data.pertandingan.forEach(match => {
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    bracketHTML += `
                        <div class="card">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b>${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b>${skorB}</b>
                            </div>
                            <div style="font-size: 11px; margin-top: 8px; color: #f1c40f; text-align: center;">
                                Pemenang: ${timMenang || 'Belum Selesai'}
                            </div>
                        </div>
                    `;
                });
                document.getElementById("bracket-container").innerHTML = bracketHTML;

                // 2. Render Data Top Scorer
                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b>${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
                document.getElementById("bracket-container").innerHTML = "<p style='color:red; text-align:center;'>Gagal memuat data dari API.</p>";
            }
        }

        fetchData();
        // Auto-refresh setiap 10 detik agar sinkron langsung dengan AppSheet / Spreadsheet
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
