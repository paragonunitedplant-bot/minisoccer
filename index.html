<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Bracket 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: rgba(10, 15, 25, 0.88);
            background-blend-mode: overlay;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #f8fafc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.4);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .court-section {
            margin-bottom: 40px;
        }
        h2.court-title {
            text-align: center;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 20px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin: 0 auto 20px auto;
            max-width: 250px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
        }
        /* Layout Bagan: Kiri - Tengah (Final/Semi) - Kanan */
        .bracket-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }
        .bracket-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 0 10px;
        }
        .card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 12px;
            width: 210px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card.final-card {
            border: 2px solid #34d399;
            background: rgba(6, 78, 59, 0.7);
            width: 230px;
        }
        .match-header {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: rgba(15, 23, 42, 0.7);
            margin-bottom: 3px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
        }
        .winner {
            border-left: 3px solid #34d399;
            background: rgba(6, 78, 59, 0.6);
        }
        .top-scorer-box {
            max-width: 450px;
            margin: 40px auto;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .top-scorer-box h2 {
            color: #34d399;
            text-transform: uppercase;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 2px solid #374151;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .scorer-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>⚽ LIVE TOURNAMENT DISPLAY 2026</h1>
    
    <!-- COURT A -->
    <div class="court-section">
        <h2 class="court-title">COURT A</h2>
        <div class="bracket-grid">
            <div class="bracket-col" id="court-a-left">
                <!-- Match A1-A4 (Kiri) akan masuk otomatis ke sini -->
            </div>
            <div class="center-col" id="court-a-center">
                <!-- Match A9-A12 (Tengah/Semi/Final) akan masuk otomatis ke sini -->
            </div>
            <div class="bracket-col" id="court-a-right" style="align-items: flex-end;">
                <!-- Match A5-A8 (Kanan) akan masuk otomatis ke sini -->
            </div>
        </div>
    </div>

    <!-- COURT B -->
    <div class="court-section">
        <h2 class="court-title">COURT B</h2>
        <div class="bracket-grid">
            <div class="bracket-col" id="court-b-left">
                <!-- Match B1-B4 (Kiri) -->
            </div>
            <div class="center-col" id="court-b-center">
                <!-- Match B9-B12 (Tengah) -->
            </div>
            <div class="bracket-col" id="court-b-right" style="align-items: flex-end;">
                <!-- Match B5-B8 (Kanan) -->
            </div>
        </div>
    </div>

    <!-- Bagian Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center; color: #94a3b8;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                let aLeft = "", aCenter = "", aRight = "";
                let bLeft = "", bCenter = "", bRight = "";

                data.pertandingan.forEach(match => {
                    let idMatch = (match.ID_Match || "").toUpperCase();
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    let isFinal = idMatch === "A12" || idMatch === "B12";

                    let cardTemplate = `
                        <div class="card ${isFinal ? 'final-card' : ''}">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b>${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b>${skorB}</b>
                            </div>
                            <div style="font-size: 9px; margin-top: 4px; color: #38bdf8; text-align: center;">
                                ${timMenang ? 'Pemenang: ' + timMenang : 'Belum Selesai'}
                            </div>
                        </div>
                    `;

                    // Pemisahan posisi berdasarkan nomor Match menyerupai gambar diagram
                    if (idMatch.startsWith("A")) {
                        let num = parseInt(idMatch.replace("A", "")) || 0;
                        if (num >= 1 && num <= 4) aLeft += cardTemplate;
                        else if (num >= 5 && num <= 8) aRight += cardTemplate;
                        else aCenter += cardTemplate; // Match 9, 10, 11, 12 di tengah
                    } else if (idMatch.startsWith("B")) {
                        let num = parseInt(idMatch.replace("B", "")) || 0;
                        if (num >= 1 && num <= 4) bLeft += cardTemplate;
                        else if (num >= 5 && num <= 8) bRight += cardTemplate;
                        else bCenter += cardTemplate; // Match 9, 10, 11, 12 di tengah
                    }
                });

                document.getElementById("court-a-left").innerHTML = aLeft || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";
                document.getElementById("court-a-center").innerHTML = aCenter || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";
                document.getElementById("court-a-right").innerHTML = aRight || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";

                document.getElementById("court-b-left").innerHTML = bLeft || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";
                document.getElementById("court-b-center").innerHTML = bCenter || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";
                document.getElementById("court-b-right").innerHTML = bRight || "<p style='color:#64748b; font-size:12px;'>Belum ada data</p>";

                // 2. Render Top Scorer
                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center; color: #94a3b8;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b style="color: #34d399;">${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
