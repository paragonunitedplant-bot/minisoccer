<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Bracket 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: rgba(10, 15, 25, 0.85);
            background-blend-mode: overlay;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #f8fafc;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.4);
            margin-bottom: 30px;
        }
        h2.court-title {
            text-align: center;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin: 30px auto 15px auto;
            max-width: 300px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            width: 240px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(52, 211, 153, 0.5);
        }
        .match-header {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.6);
            margin-bottom: 4px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .winner {
            border-left: 4px solid #34d399;
            background: rgba(6, 78, 59, 0.5);
        }
        .top-scorer-box {
            max-width: 450px;
            margin: 40px auto;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .top-scorer-box h2 {
            color: #34d399;
            text-transform: uppercase;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 2px solid #374151;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .scorer-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>⚽ LIVE TOURNAMENT DISPLAY 2026</h1>
    
    <!-- Court A Section -->
    <h2 class="court-title">COURT A (A1 - A12)</h2>
    <div class="container" id="court-a-container">
        <p style="text-align: center; width: 100%; color: #94a3b8;">Memuat data Court A...</p>
    </div>

    <!-- Court B Section -->
    <h2 class="court-title">COURT B (B1 - B12)</h2>
    <div class="container" id="court-b-container">
        <p style="text-align: center; width: 100%; color: #94a3b8;">Memuat data Court B...</p>
    </div>

    <!-- Bagian Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center; color: #94a3b8;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                let courtAHTML = "";
                let courtBHTML = "";

                // Filter dan pisahkan berdasarkan awalan ID Match (A atau B)
                data.pertandingan.forEach(match => {
                    let idMatch = (match.ID_Match || "").toUpperCase();
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    let cardTemplate = `
                        <div class="card">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b>${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b>${skorB}</b>
                            </div>
                            <div style="font-size: 10px; margin-top: 8px; color: #38bdf8; text-align: center;">
                                ${timMenang ? 'Pemenang: ' + timMenang : 'Belum Selesai'}
                            </div>
                        </div>
                    `;

                    if (idMatch.startsWith("A")) {
                        courtAHTML += cardTemplate;
                    } else if (idMatch.startsWith("B")) {
                        courtBHTML += cardTemplate;
                    }
                });

                document.getElementById("court-a-container").innerHTML = courtAHTML || "<p style='color:#94a3b8; text-align:center;'>Belum ada pertandingan Court A.</p>";
                document.getElementById("court-b-container").innerHTML = courtBHTML || "<p style='color:#94a3b8; text-align:center;'>Belum ada pertandingan Court B.</p>";

                // 2. Render Data Top Scorer
                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center; color: #94a3b8;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b style="color: #34d399;">${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
