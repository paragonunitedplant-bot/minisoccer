<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Display 2026</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: rgba(10, 15, 25, 0.92);
            background-blend-mode: overlay;
            color: #ffffff;
            margin: 0;
            padding: 10px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }
        h1 {
            text-align: center;
            color: #f8fafc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.4);
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }
        /* Layout Full Layar tanpa tumpang tindih */
        .main-bracket-layout {
            display: grid;
            grid-template-columns: 1fr 240px 1fr;
            gap: 15px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            align-items: center;
        }
        .court-side {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .round-col {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 8px;
            min-height: 480px; /* Menjaga jarak vertikal agar tidak bertindih */
        }
        .round-title {
            font-size: 9px;
            text-align: center;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        /* Kotak Tengah (Juara 1 & 3) */
        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            min-height: 480px;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 5px 8px;
            width: 100%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        }
        .card.final-card {
            border: 2px solid #ef4444;
            background: rgba(127, 29, 29, 0.8);
        }
        .card.third-card {
            border: 2px solid #f59e0b;
            background: rgba(146, 64, 14, 0.8);
        }
        .match-header {
            font-size: 8px;
            color: #94a3b8;
            margin-bottom: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 5px;
            background: rgba(15, 23, 42, 0.75);
            margin-bottom: 2px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
        }
        .winner {
            border-left: 3px solid #34d399;
            background: rgba(6, 78, 59, 0.6);
        }
        /* Top Scorer di Bawah (Kecil & Rapi) */
        .top-scorer-box {
            width: 100%;
            max-width: 380px;
            margin: 5px auto 0 auto;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .top-scorer-box h2 {
            color: #34d399;
            text-transform: uppercase;
            font-size: 0.85rem;
            text-align: center;
            border-bottom: 1px solid #374151;
            padding-bottom: 4px;
            margin: 0 0 6px 0;
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
        }
        .scorer-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>⚽ LIVE TOURNAMENT DISPLAY 2026</h1>
    
    <div class="main-bracket-layout">
        <!-- SISI KIRI: COURT A -->
        <div class="court-side">
            <div class="round-col">
                <div class="round-title">RND 24</div>
                <div id="a-r24-1"></div><div id="a-r24-2"></div><div id="a-r24-3"></div><div id="a-r24-4"></div>
            </div>
            <div class="round-col">
                <div class="round-title">RND 16</div>
                <div id="a-r16-5"></div><div id="a-r16-6"></div><div id="a-r16-7"></div><div id="a-r16-8"></div>
            </div>
            <div class="round-col" style="justify-content: center;">
                <div class="round-title">QF</div>
                <div id="a-qf-9"></div><div id="a-qf-10"></div>
            </div>
            <div class="round-col" style="justify-content: center;">
                <div class="round-title">SF</div>
                <div id="a-sf-11"></div>
            </div>
        </div>

        <!-- TENGAH: GRAND FINAL & PEREBUTAN JUARA 3 -->
        <div class="center-stage">
            <div style="font-size: 9px; color: #ef4444; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">🏆 Grand Final (Juara 1)</div>
            <div id="final-box" style="width: 100%;">
                <div class="card final-card">
                    <div class="match-header">MATCH: A12</div>
                    <div class="team-row"><span>TBD</span><b>0</b></div>
                    <div class="team-row"><span>TBD</span><b>0</b></div>
                </div>
            </div>

            <div style="font-size: 9px; color: #f59e0b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;">🥉 Perebutan Juara 3</div>
            <div id="third-box" style="width: 100%;">
                <div class="card third-card">
                    <div class="match-header">MATCH: B12</div>
                    <div class="team-row"><span>TBD</span><b>0</b></div>
                    <div class="team-row"><span>TBD</span><b>0</b></div>
                </div>
            </div>
        </div>

        <!-- SISI KANAN: COURT B -->
        <div class="court-side">
            <div class="round-col" style="justify-content: center;">
                <div class="round-title">SF</div>
                <div id="b-sf-11"></div>
            </div>
            <div class="round-col" style="justify-content: center;">
                <div class="round-title">QF</div>
                <div id="b-qf-9"></div><div id="b-qf-10"></div>
            </div>
            <div class="round-col">
                <div class="round-title">RND 16</div>
                <div id="b-r16-5"></div><div id="b-r16-6"></div><div id="b-r16-7"></div><div id="b-r16-8"></div>
            </div>
            <div class="round-col">
                <div class="round-title">RND 24</div>
                <div id="b-r24-1"></div><div id="b-r24-2"></div><div id="b-r24-3"></div><div id="b-r24-4"></div>
            </div>
        </div>
    </div>

    <!-- Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center; color: #94a3b8; font-size: 11px; margin: 3px 0;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                data.pertandingan.forEach(match => {
                    let idMatch = (match.ID_Match || "").toUpperCase();
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    let cardHTML = `
                        <div class="card ${idMatch === 'A12' ? 'final-card' : (idMatch === 'B12' ? 'third-card' : '')}">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b>${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b>${skorB}</b>
                            </div>
                            <div style="font-size: 7px; margin-top: 1px; color: #38bdf8; text-align: center;">
                                ${timMenang ? 'Menang: ' + timMenang : 'Belum Selesai'}
                            </div>
                        </div>
                    `;

                    if (idMatch === "A12") {
                        document.getElementById("final-box").innerHTML = cardHTML;
                        return;
                    }
                    if (idMatch === "B12") {
                        document.getElementById("third-box").innerHTML = cardHTML;
                        return;
                    }

                    let prefix = idMatch.startsWith("A") ? "a" : (idMatch.startsWith("B") ? "b" : "");
                    if (prefix) {
                        let num = parseInt(idMatch.replace(prefix.toUpperCase(), "")) || 0;
                        let targetId = "";
                        if (num >= 1 && num <= 4) targetId = `${prefix}-r24-${num}`;
                        else if (num >= 5 && num <= 8) targetId = `${prefix}-r16-${num}`;
                        else if (num === 9 || num === 10) targetId = `${prefix}-qf-${num}`;
                        else if (num === 11) targetId = `${prefix}-sf-11`;

                        let el = document.getElementById(targetId);
                        if (el) el.innerHTML = cardHTML;
                    }
                });

                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center; color: #94a3b8; font-size: 11px; margin: 3px 0;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b style="color: #34d399;">${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
