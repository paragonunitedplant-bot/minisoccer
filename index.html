<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Display 2026</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: rgba(10, 15, 25, 0.92);
            background-blend-mode: overlay;
            color: #ffffff;
            margin: 0;
            padding: 15px 20px;
            min-height: 100vh;
        }
        /* Top Header ala Turnamen */
        .top-header {
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 3px solid #ef4444;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .top-header h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #f8fafc;
        }
        .live-badge {
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Sub-Header Turnamen */
        .sub-header {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Layout Utama 9 Kolom (Sisi Kiri: A, Tengah: Final, Sisi Kanan: B) */
        .bracket-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 280px 1fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            max-width: 1650px;
            margin: 0 auto;
        }

        /* Header Kolom Tahapan */
        .col-header {
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px 2px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .col-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: space-around;
            min-height: 520px;
        }

        /* Kotak Pertandingan */
        .card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 6px 8px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .card.final-card {
            border: 2px solid #ef4444;
            background: rgba(127, 29, 29, 0.85);
        }
        .card.third-card {
            border: 2px solid #f59e0b;
            background: rgba(146, 64, 14, 0.85);
        }
        .match-header {
            font-size: 8px;
            color: #94a3b8;
            margin-bottom: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            background: rgba(15, 23, 42, 0.75);
            margin-bottom: 2px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
        }
        .winner {
            border-left: 3px solid #34d399;
            background: rgba(6, 78, 59, 0.6);
        }

        /* Center Stage (Kotak Tengah Grand Final & Juara 3) */
        .center-stage {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px 12px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            min-height: 520px;
        }

        /* Top Scorer di Bawah */
        .top-scorer-box {
            width: 100%;
            max-width: 420px;
            margin: 30px auto 10px auto;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }
        .top-scorer-box h2 {
            color: #34d399;
            text-transform: uppercase;
            font-size: 0.95rem;
            text-align: center;
            border-bottom: 1px solid #374151;
            padding-bottom: 6px;
            margin: 0 0 8px 0;
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
        }
        .scorer-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- Header Atas -->
    <div class="top-header">
        <h2>🏆 Sport Community Cup Plant - 2026</h2>
        <div class="live-badge">● LIVE</div>
    </div>

    <div class="sub-header">
        MINI SOCCER TOURNAMENT - MAIN BRACKET
    </div>

    <!-- Layout Bagan 9 Kolom Presisi -->
    <div class="bracket-wrapper">
        
        <!-- === SISI KIRI (COURT A) === -->
        <!-- Kolom 1: Round 24 (A1-A4) -->
        <div>
            <div class="col-header">Round 24</div>
            <div class="col-group">
                <div id="a-r24-1"></div><div id="a-r24-2"></div><div id="a-r24-3"></div><div id="a-r24-4"></div>
            </div>
        </div>

        <!-- Kolom 2: Round 16 (A5-A8) -->
        <div>
            <div class="col-header">Round 16</div>
            <div class="col-group">
                <div id="a-r16-5"></div><div id="a-r16-6"></div><div id="a-r16-7"></div><div id="a-r16-8"></div>
            </div>
        </div>

        <!-- Kolom 3: Quarter Final (A9-A10) -->
        <div>
            <div class="col-header">Quarter Final</div>
            <div class="col-group" style="justify-content: space-around;">
                <div id="a-qf-9"></div><div id="a-qf-10"></div>
            </div>
        </div>

        <!-- Kolom 4: Semifinal A (A11) -->
        <div>
            <div class="col-header">Semifinal</div>
            <div class="col-group" style="justify-content: center;">
                <div id="a-sf-11"></div>
            </div>
        </div>

        <!-- === TENGAH: GRAND FINAL & JUARA 3 === -->
        <div class="center-stage">
            <div style="width: 100%;">
                <div style="font-size: 9px; color: #ef4444; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; text-align: center;">🏆 Grand Final (Juara 1)</div>
                <div id="final-box">
                    <div class="card final-card">
                        <div class="match-header">MATCH: A12</div>
                        <div class="team-row"><span>TBD</span><b>0</b></div>
                        <div class="team-row"><span>TBD</span><b>0</b></div>
                    </div>
                </div>
            </div>

            <div style="width: 100%;">
                <div style="font-size: 9px; color: #f59e0b; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; text-align: center;">🥉 Perebutan Juara 3</div>
                <div id="third-box">
                    <div class="card third-card">
                        <div class="match-header">MATCH: B12</div>
                        <div class="team-row"><span>TBD</span><b>0</b></div>
                        <div class="team-row"><span>TBD</span><b>0</b></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- === SISI KANAN (COURT B) === -->
        <!-- Kolom 6: Semifinal B (B11) -->
        <div>
            <div class="col-header">Semifinal</div>
            <div class="col-group" style="justify-content: center;">
                <div id="b-sf-11"></div>
            </div>
        </div>

        <!-- Kolom 7: Quarter Final (B9-B10) -->
        <div>
            <div class="col-header">Quarter Final</div>
            <div class="col-group" style="justify-content: space-around;">
                <div id="b-qf-9"></div><div id="b-qf-10"></div>
            </div>
        </div>

        <!-- Kolom 8: Round 16 (B5-B8) -->
        <div>
            <div class="col-header">Round 16</div>
            <div class="col-group">
                <div id="b-r16-5"></div><div id="b-r16-6"></div><div id="b-r16-7"></div><div id="b-r16-8"></div>
            </div>
        </div>

        <!-- Kolom 9: Round 24 (B1-B4) -->
        <div>
            <div class="col-header">Round 24</div>
            <div class="col-group">
                <div id="b-r24-1"></div><div id="b-r24-2"></div><div id="b-r24-3"></div><div id="b-r24-4"></div>
            </div>
        </div>

    </div>

    <!-- Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center; color: #94a3b8; font-size: 12px; margin: 5px 0;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                data.pertandingan.forEach(match => {
                    let idMatch = (match.ID_Match || "").toUpperCase();
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    let cardHTML = `
                        <div class="card ${idMatch === 'A12' ? 'final-card' : (idMatch === 'B12' ? 'third-card' : '')}">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b>${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b>${skorB}</b>
                            </div>
                            <div style="font-size: 8px; margin-top: 2px; color: #38bdf8; text-align: center;">
                                ${timMenang ? 'Menang: ' + timMenang : 'Belum Selesai'}
                            </div>
                        </div>
                    `;

                    if (idMatch === "A12") {
                        document.getElementById("final-box").innerHTML = cardHTML;
                        return;
                    }
                    if (idMatch === "B12") {
                        document.getElementById("third-box").innerHTML = cardHTML;
                        return;
                    }

                    let prefix = idMatch.startsWith("A") ? "a" : (idMatch.startsWith("B") ? "b" : "");
                    if (prefix) {
                        let num = parseInt(idMatch.replace(prefix.toUpperCase(), "")) || 0;
                        let targetId = "";
                        if (num >= 1 && num <= 4) targetId = `${prefix}-r24-${num}`;
                        else if (num >= 5 && num <= 8) targetId = `${prefix}-r16-${num}`;
                        else if (num === 9 || num === 10) targetId = `${prefix}-qf-${num}`;
                        else if (num === 11) targetId = `${prefix}-sf-11`;

                        let el = document.getElementById(targetId);
                        if (el) el.innerHTML = cardHTML;
                    }
                });

                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center; color: #94a3b8; font-size: 12px; margin: 5px 0;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b style="color: #34d399;">${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
