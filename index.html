<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tournament Display</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: url('Screenshot 2026-10-05 141616.png') no-repeat center center fixed;
    background-size: cover;
    background-color: rgba(10, 15, 25, 0.82);
    background-blend-mode: overlay;
    color: #ffffff;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}
        h1 {
            text-align: center;
            color: #f8fafc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.3);
            margin-bottom: 30px;
        }
        h2 {
            color: #34d399;
            text-transform: uppercase;
            font-size: 1.2rem;
            letter-spacing: 1px;
            margin-top: 0;
            border-bottom: 2px solid #374151;
            padding-bottom: 10px;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 18px;
            width: 280px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(52, 211, 153, 0.4);
        }
        .match-header {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            margin-bottom: 6px;
            border-radius: 6px;
            font-weight: 600;
        }
        .winner {
            border-left: 4px solid #34d399;
            background: rgba(6, 78, 59, 0.4);
        }
        .top-scorer-box {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .scorer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .scorer-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>⚽ LIVE TOURNAMENT DISPLAY</h1>
    
    <!-- Bagian Kotak Pertandingan -->
    <div class="container" id="bracket-container">
        <p style="text-align: center; width: 100%; color: #94a3b8;">Memuat data pertandingan...</p>
    </div>

    <!-- Bagian Top Scorer -->
    <div class="top-scorer-box">
        <h2>🔥 Top Scorer</h2>
        <div id="scorer-container">
            <p style="text-align: center; color: #94a3b8;">Memuat data top scorer...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4VUx2BrymlZynUeOsQrntqkIEA-49nuIw8fZCw1tE2HKPWETyEneGYtiWw98qfABX5A/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                // 1. Render Data Pertandingan
                let bracketHTML = "";
                data.pertandingan.forEach(match => {
                    let timA = match.Tim_A || 'TBD';
                    let timB = match.Tim_B || 'TBD';
                    let skorA = match.Live_Skor_A !== undefined ? match.Live_Skor_A : 0;
                    let skorB = match.Live_Skor_B !== undefined ? match.Live_Skor_B : 0;
                    let timMenang = match.Tim_Menang || '';

                    let isTeamAWin = timMenang === timA;
                    let isTeamBWin = timMenang === timB;

                    bracketHTML += `
                        <div class="card">
                            <div class="match-header">Match: ${match.ID_Match}</div>
                            <div class="team-row ${isTeamAWin ? 'winner' : ''}">
                                <span>${timA}</span>
                                <b style="font-size: 1.1rem;">${skorA}</b>
                            </div>
                            <div class="team-row ${isTeamBWin ? 'winner' : ''}">
                                <span>${timB}</span>
                                <b style="font-size: 1.1rem;">${skorB}</b>
                            </div>
                            <div style="font-size: 11px; margin-top: 10px; color: #38bdf8; text-align: center; font-weight: 500;">
                                Status: ${timMenang ? 'Pemenang: ' + timMenang : 'Belum Selesai'}
                            </div>
                        </div>
                    `;
                });
                document.getElementById("bracket-container").innerHTML = bracketHTML;

                // 2. Render Data Top Scorer
                let scorerHTML = "";
                if(data.top_scorer.length === 0) {
                    scorerHTML = "<p style='text-align:center; color: #94a3b8;'>Belum ada gol tercatat.</p>";
                } else {
                    data.top_scorer.forEach(s => {
                        scorerHTML += `
                            <div class="scorer-row">
                                <span>${s.pemain}</span>
                                <b style="color: #34d399;">${s.total_gol} Gol</b>
                            </div>
                        `;
                    });
                }
                document.getElementById("scorer-container").innerHTML = scorerHTML;

            } catch (error) {
                console.error("Gagal mengambil data:", error);
                document.getElementById("bracket-container").innerHTML = "<p style='color:#f87171; text-align:center;'>Gagal memuat data dari API.</p>";
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
